<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마블 서바이벌 레이스 프로 | Sonssam EduTech</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
  <script src="../common-nav.js" defer></script>
  <style>
    :root {
      --bg: #070a12;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --border: #334155;
      --accent: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #070a12;
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top Bar */
    .top-bar {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 50;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #modeSelect { max-width: 220px; }
    .brand-badge {
      background: linear-gradient(135deg, #ec4899, #f59e0b);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 800;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-tool {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text);
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-tool:hover {
      background: #334155;
      border-color: #475569;
    }
    .btn-tool.active {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent);
      color: #a5b4fc;
    }

    /* Launch Button */
    .btn-start-race {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .btn-start-race:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }
    .btn-start-race:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Arena Container */
    .arena-container {
      flex: 1;
      display: flex;
      position: relative;
      height: calc(100vh - 56px);
      min-height: 0;
      overflow: hidden;
    }

    /* Canvas Viewport */
    .canvas-wrapper {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 30%, #10172a 0%, #05070d 100%);
      overflow: hidden;
    }
    #raceCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #raceCanvas:active {
      cursor: grabbing;
    }

    /* Speed Multiplier Group */
    .speed-control-group {
      display: flex;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 2px;
      gap: 2px;
    }
    .btn-speed {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-speed:hover {
      color: #fff;
    }
    .btn-speed.active {
      background: #3b82f6;
      color: #fff;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    /* Floating Camera Auto-Follow Badge */
    .btn-auto-follow {
      position: absolute;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid var(--accent-cyan);
      backdrop-filter: blur(12px);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #a5f3fc;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 25;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      animation: floatBadge 2s ease-in-out infinite;
    }
    .btn-auto-follow:hover {
      background: var(--accent-cyan);
      color: #020617;
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 8px 25px rgba(6, 182, 212, 0.6);
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-4px); }
    }

    /* Floating Status / Commentary Banner */
    .floating-hud {
      position: absolute;
      top: 14px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-pill {
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid var(--accent-cyan);
      backdrop-filter: blur(10px);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #e0f2fe;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Minimap (Track Progress Indicator) */
    .minimap-wrapper {
      position: absolute;
      right: 12px;
      top: 72px;
      bottom: 16px;
      width: 24px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #334155;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
      pointer-events: none;
    }
    .minimap-track {
      flex: 1;
      width: 6px;
      background: #1e293b;
      border-radius: 3px;
      position: relative;
    }
    .minimap-finish {
      position: absolute;
      bottom: 0;
      left: -6px;
      right: -6px;
      height: 4px;
      background: #10b981;
      border-radius: 2px;
    }
    .minimap-dot {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      box-shadow: 0 0 6px currentColor;
    }

    /* Right Sidebar: Real-time Leaderboard */
    .sidebar {
      width: 320px;
      background: rgba(15, 23, 42, 0.96);
      border-left: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 20;
    }
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rank-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 800;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .rank-item:hover {
      background: #334155;
      transform: translateX(-4px);
    }
    .rank-item.focused {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.45);
      background: rgba(6, 182, 212, 0.16);
    }
    .rank-item.top-1 {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), #1e293b);
      border-color: #f59e0b;
    }
    .rank-item.top-2 {
      background: linear-gradient(135deg, rgba(148, 163, 184, 0.2), #1e293b);
      border-color: #94a3b8;
    }
    .rank-item.top-3 {
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.2), #1e293b);
      border-color: #d97706;
    }
    .rank-item.finished {
      border-color: #10b981;
    }
    .rank-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 900;
      font-family: monospace;
      flex-shrink: 0;
    }
    .rank-item.top-1 .rank-badge { background: #f59e0b; color: #000; }
    .rank-item.top-2 .rank-badge { background: #94a3b8; color: #000; }
    .rank-item.top-3 .rank-badge { background: #d97706; color: #fff; }

    .marble-dot-preview {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }
    .rank-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-time {
      font-size: 0.78rem;
      font-family: monospace;
      color: var(--text-muted);
    }

    /* Podium Overlay Modal — fixed to the viewport so it sits on the TV, not under the chrome */
    .podium-modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.82);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }
    .podium-modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .podium-card {
      background: #1e293b;
      border: 2px solid var(--accent);
      border-radius: 20px;
      width: min(720px, 96%);
      max-height: min(92dvh, 820px);
      padding: 18px 20px 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: scale(0.96);
      transition: transform 0.35s;
      overflow: hidden;
    }
    .podium-side {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }
    .podium-modal.open .podium-card { transform: scale(1); }
    .podium-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .podium-hero {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.28), rgba(15, 23, 42, 0.4));
      border: 1.5px solid #f59e0b;
      flex-shrink: 0;
    }
    .podium-hero.show { display: flex; }
    .podium-hero.last {
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.28), rgba(15, 23, 42, 0.4));
      border-color: #fb7185;
    }
    .podium-hero-label {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fde68a;
    }
    .podium-hero.last .podium-hero-label { color: #fecdd3; }
    .podium-hero-name {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.15;
    }
    .podium-hero-meta {
      font-size: 0.85rem;
      font-family: ui-monospace, monospace;
      color: #cbd5e1;
    }
    .podium-stands {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      height: 132px;
      flex-shrink: 0;
    }
    .podium-stands.is-hidden { display: none; }
    .stand {
      flex: 1;
      max-width: 160px;
      border-radius: 12px 12px 6px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px 8px;
      position: relative;
    }
    .stand-1 {
      height: 128px;
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
      color: #fff;
      order: 2;
    }
    .stand-2 {
      height: 104px;
      background: linear-gradient(180deg, #94a3b8 0%, #475569 100%);
      color: #fff;
      order: 1;
    }
    .stand-3 {
      height: 88px;
      background: linear-gradient(180deg, #d97706 0%, #78350f 100%);
      color: #fff;
      order: 3;
    }
    .stand-rank {
      font-size: 1.15rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
    }
    .stand-name {
      font-size: 1rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .stand-meta {
      font-size: 0.72rem;
      margin-top: 4px;
      opacity: 0.9;
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }
    .podium-message {
      font-size: 0.95rem;
      font-weight: 800;
      color: #7dd3fc;
      flex-shrink: 0;
    }
    .podium-board {
      columns: 2;
      column-gap: 8px;
      overflow-y: auto;
      min-height: 0;
      flex: 1 1 auto;
      max-height: 42vh;
      padding: 2px;
      text-align: left;
    }
    .podium-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      break-inside: avoid;
      margin-bottom: 4px;
    }
    .podium-row.top { border-color: #f59e0b; }
    .podium-row.last { border-color: #fb7185; }
    .podium-row-rank {
      width: 2.4em;
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .podium-row.top .podium-row-rank { color: #fbbf24; }
    .podium-row-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f8fafc;
    }
    .podium-row-time {
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      color: #94a3b8;
      font-size: 0.75rem;
    }
    .podium-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }
    @media (max-width: 640px) {
      .podium-board { columns: 1; max-height: 34vh; }
      .podium-title { font-size: 1.2rem; }
      .podium-hero-name { font-size: 1.5rem; }
      .podium-stands { height: 110px; }
      .stand-1 { height: 108px; }
      .stand-2 { height: 90px; }
      .stand-3 { height: 76px; }
    }
    /* Landscape / short classroom TV: use width, keep every rank on screen */
    @media (orientation: landscape) {
      .podium-modal { padding: 8px; }
      .podium-card {
        width: min(1180px, 98vw);
        max-height: 96dvh;
        display: grid;
        grid-template-columns: minmax(210px, 270px) 1fr;
        grid-template-areas:
          "side board"
          "actions actions";
        gap: 8px 16px;
        padding: 12px 14px 10px;
        align-items: start;
      }
      .podium-side { grid-area: side; gap: 8px; }
      .podium-title { font-size: 1.2rem; justify-content: flex-start; }
      .podium-hero { padding: 8px 10px; }
      .podium-hero-name { font-size: 1.45rem; }
      .podium-stands {
        height: auto;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .stand {
        max-width: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
      }
      .stand-1, .stand-2, .stand-3 { height: auto; min-height: 44px; }
      .stand-1 { order: 1; }
      .stand-2 { order: 2; }
      .stand-3 { order: 3; }
      .stand-rank { font-size: 0.9rem; margin-bottom: 0; }
      .stand-name { font-size: 0.95rem; }
      .podium-message { font-size: 0.85rem; text-align: left; }
      .podium-board {
        grid-area: board;
        max-height: min(72dvh, 560px);
        columns: 2;
        column-gap: 8px;
      }
      .podium-row { padding: 5px 8px; margin-bottom: 3px; font-size: 0.84rem; }
      .podium-actions { grid-area: actions; }
    }
    @media (orientation: landscape) and (min-width: 1400px) {
      .podium-card { width: min(1280px, 90vw); }
      .podium-side { min-width: 300px; }
      .podium-title { font-size: 1.6rem; }
      .stand-name { font-size: 1.15rem; }
      .stand-rank { font-size: 1rem; }
      .podium-row { font-size: 1rem; padding: 8px 12px; }
      .podium-hero-name { font-size: 1.8rem; }
    }
    @media (orientation: landscape) and (max-height: 480px) {
      .podium-card {
        grid-template-columns: minmax(170px, 210px) 1fr;
        gap: 6px 12px;
        padding: 8px 10px;
      }
      .podium-board { columns: 3; max-height: min(78dvh, 320px); }
      .podium-hero-name { font-size: 1.2rem; }
      .stand-1, .stand-2, .stand-3 { min-height: 36px; padding: 5px 8px; }
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-dialog {
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 20px;
      width: min(640px, 94%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .form-textarea {
      background: #0f172a;
      border: 1.5px solid #334155;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 150px;
      outline: none;
    }
    .form-textarea:focus { border-color: var(--accent); }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    .map-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 10px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .map-chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .map-chip:hover { border-color: #64748b; }
    .map-chip.active {
      background: rgba(6, 182, 212, 0.2);
      border-color: #22d3ee;

  <!-- Main Physics & Game Script -->
  <script>
    // --- Safe Preset Roster (Zero Personal Data) ---
    const ROSTER_KEY = 'marble_race_roster_v2';
    const DEFAULT_ROSTER = Array.from({ length: 20 }, (_, i) => `${i + 1}번 구슬`);

    const MARBLE_PALETTES = [
      { main: '#f43f5e', glow: '#fda4af', name: 'Ruby' },
      { main: '#f97316', glow: '#fed7aa', name: 'Amber' },
      { main: '#eab308', glow: '#fef08a', name: 'Topaz' },
      { main: '#10b981', glow: '#a7f3d0', name: 'Emerald' },
      { main: '#06b6d4', glow: '#a5f3fc', name: 'Cyan' },
      { main: '#3b82f6', glow: '#bfdbfe', name: 'Sapphire' },
      { main: '#6366f1', glow: '#c7d2fe', name: 'Indigo' },
      { main: '#8b5cf6', glow: '#ddd6fe', name: 'Amethyst' },
      { main: '#d946ef', glow: '#f5d0fe', name: 'Fuchsia' },
      { main: '#14b8a6', glow: '#99f6e4', name: 'Teal' },
      { main: '#0ea5e9', glow: '#bae6fd', name: 'Sky' },
      { main: '#84cc16', glow: '#d9f99d', name: 'Lime' }
    ];

    let state = {
      names: (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(ROSTER_KEY));
          if (Array.isArray(saved) && saved.length >= 2) return saved;
        } catch (e) {}
        return DEFAULT_ROSTER;
      })(),
      gameMode: 'championship',
      soundEnabled: true,
      racing: false,
      countingDown: false,
      finished: false,
      startTime: 0,
      elapsedMs: 0,
      finishRank: [],
      speedMultiplier: 1.0,
      timeScale: 1.0,
      shuffleStart: false,
      bigMarbles: false,
      sim: false
    };

    let cameraControl = {
      manual: false,
      isDragging: false,
      dragStartY: 0,
      dragCamStartY: 0,
      focusedMarble: null
    };

    function resumeAutoFollow() {
      cameraControl.manual = false;
      cameraControl.focusedMarble = null;
      updateCameraBadge();
      renderSidebarList();
    }

    function focusMarble(marble) {
      cameraControl.focusedMarble = marble;
      cameraControl.manual = false;
      updateCameraBadge();
      renderSidebarList();
    }

    function updateCameraBadge() {
      const btn = document.getElementById('btnAutoFollow');
      const text = document.getElementById('autoFollowText');
      if (!btn || !text) return;

      if (cameraControl.focusedMarble) {
        btn.style.display = 'flex';
        text.textContent = `🎯 ${cameraControl.focusedMarble.name} 추적 중 (클릭 시 선두 복귀)`;
      } else if (cameraControl.manual) {
        btn.style.display = 'flex';
        text.textContent = '🎯 선두 자동 추적으로 복귀 (스페이스바 / 클릭)';
      } else {
        btn.style.display = 'none';
      }
    }

    let raceGen = 0;

    function skipToFinish() {
      if (!state.racing || state.finished) return;
      // Rank all unfinished marbles instantly by current Y position
      const unfinished = marbles.filter(m => !m.finished).sort((a, b) => b.y - a.y);
      const baseTime = ((Date.now() - state.startTime) / 1000);
      unfinished.forEach((m, idx) => {
        m.finished = true;
        m.finishTime = (baseTime + idx * 0.05).toFixed(2);
        state.finishRank.push(m);
        m.rank = state.finishRank.length;
      });
      endRace();
    }

    // --- Web Audio Synthesizer ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    let lastSoundAt = 0;
    function playSound(type, param = 1) {
      if (!state.soundEnabled) return;
      if (typeof window.isSonssamAudioMuted === 'function' && window.isSonssamAudioMuted()) return;
      if (type === 'clack' || type === 'bumper') {
        const nowMs = performance.now();
        if (nowMs - lastSoundAt < 50) return;
        lastSoundAt = nowMs;
      }
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        if (type === 'clack') {
          // Sharp glass marble collision click
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          const freq = Math.min(2400, 1000 + param * 120);
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.3, now + 0.035);
          gain.gain.setValueAtTime(Math.min(0.35, 0.06 + param * 0.03), now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.035);
        } else if (type === 'bumper') {
          // Energetic electric pinball bumper THUMP
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'booster') {
          // Jet booster whoosh
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'vortex') {
          // Sci-fi warp portal
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.28);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.08);
            gain.gain.setValueAtTime(0, now + i * 0.08);
            gain.gain.linearRampToValueAtTime(0.28, now + i * 0.08 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.35);
          });
        }
      } catch (e) {}
    }

    // --- Confetti Engine ---
    const confCanvas = document.getElementById('confettiCanvas');
    const confCtx = confCanvas.getContext('2d');
    let confettiList = [];
    let confAnimId = null;

    function resizeConfetti() {
      confCanvas.width = window.innerWidth;
      confCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      confettiList = [];
      const colors = ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#ffffff'];
      for (let i = 0; i < 150; i++) {
        confettiList.push({
          x: confCanvas.width / 2,
          y: confCanvas.height * 0.4,
          vx: (Math.random() - 0.5) * 22,
          vy: (Math.random() - 0.5) * 22 - 5,
          size: Math.random() * 9 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 14,
          alpha: 1,
          gravity: 0.3
        });
      }
      if (!confAnimId) animConfetti();
    }

    function animConfetti() {
      confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
      let alive = false;
      confettiList.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rotation += p.rotSpeed;
        p.alpha -= 0.006;

        if (p.alpha > 0) {
          alive = true;
          confCtx.save();
          confCtx.translate(p.x, p.y);
          confCtx.rotate((p.rotation * Math.PI) / 180);
          confCtx.fillStyle = p.color;
          confCtx.globalAlpha = Math.max(0, p.alpha);
          confCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          confCtx.restore();
        }
      });
      if (alive) {
        confAnimId = requestAnimationFrame(animConfetti);
      } else {
        cancelAnimationFrame(confAnimId);
        confAnimId = null;
        confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
      }
    }

    // --- Track world ---
    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');
    const TRACK_WIDTH = 760;
    const TRACK_HALF_WIDTH = TRACK_WIDTH / 2;
    const MAP_KEY = 'marble_race_map_v1';
    const RESTITUTION = 0.78;

    function phys() {
      const p = (currentMap && currentMap.phys) || {};
      return {
        gravity: p.gravity ?? 0.21,
        friction: p.friction ?? 0.994,
        maxV: p.maxV ?? 7.8,
        bounce: p.bounce ?? 1
      };
    }

    let TRACK_HEIGHT = 7800;
    let FINISH_LINE_Y = 7050;
    let cameraY = 180;
    let marbles = [];
    let segments = [];
    let bumpers = [];
    let spinners = [];
    let boosters = [];
    let vortexes = [];
    let zones = [];
    let conveyors = [];
    let portals = [];
    let pads = [];
    let gateClosed = true;
    let currentMap = null;
    let ghostPath = [];
    let lastGhost = null;
    let lastEventAt = 0;

    function ty(y) { return y <= 300 ? y : 300 + (y - 300) * 3; }

    function clearWorld() {
      segments = []; bumpers = []; spinners = []; boosters = [];
      vortexes = []; zones = []; conveyors = []; portals = []; pads = [];
    }

    function addRails() {
      segments.push({ x1: -TRACK_HALF_WIDTH, y1: 0, x2: -TRACK_HALF_WIDTH, y2: TRACK_HEIGHT, type: 'wall' });
      segments.push({ x1: TRACK_HALF_WIDTH, y1: 0, x2: TRACK_HALF_WIDTH, y2: TRACK_HEIGHT, type: 'wall' });
      segments.push({ x1: -TRACK_HALF_WIDTH, y1: 0, x2: TRACK_HALF_WIDTH, y2: 0, type: 'wall' });
    }

    function addFunnel(y1, y2, mouth) {
      segments.push({ x1: -TRACK_HALF_WIDTH, y1: y1, x2: -mouth, y2: y2, type: 'wall' });
      segments.push({ x1: TRACK_HALF_WIDTH, y1: y1, x2: mouth, y2: y2, type: 'wall' });
    }

    function addPost(x, y1, y2) {
      segments.push({ x1: x, y1: y1, x2: x, y2: y2, type: 'wall' });
    }

    function addVortexAt(x, y, r, warpAhead, extra) {
      vortexes.push(Object.assign({
        x, y, r,
        pull: 0.55,
        warpY: y + warpAhead,
        scatter: true
      }, extra || {}));
    }

    function addBumper(x, y, r, power, mega, osc) {
      bumpers.push({ x, y, r, power: power || 1.35, flashTimer: 0, isMega: !!mega, osc: osc || null, phase: 0, cx: x });
    }

    function addFinish(yFinish) {
      FINISH_LINE_Y = yFinish;
      const nextH = yFinish + 250;
      if (nextH > TRACK_HEIGHT) {

    function inBox(m, z) {
      return m.x > z.x - z.w / 2 && m.x < z.x + z.w / 2 &&
             m.y > z.y - z.h / 2 && m.y < z.y + z.h / 2;
    }

    function initMarbles() {
      marbles = [];
      state.finishRank = [];
      state.finished = false;
      gateClosed = true;
      cameraY = 180;
      state.timeScale = 1.0;
      ghostPath = [];

      const n = state.names.length;
      const cols = n <= 12 ? 4 : n <= 20 ? 5 : n <= 30 ? 6 : 7;
      const rows = Math.max(1, Math.ceil(n / cols));
      const usableTop = 40;
      const usableBottom = 300 - 28;
      const spacingX = Math.min(110, (TRACK_WIDTH - 120) / Math.max(cols, 1));
      const spacingY = rows === 1 ? 0 : Math.min(56, (usableBottom - usableTop) / (rows - 1));
      const startX = -((cols - 1) * spacingX) / 2;
      const r = state.bigMarbles ? 27 : 24;

      let items = state.names.map((name, i) => ({ name, i }));
      if (state.shuffleStart) {
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = items[i]; items[i] = items[j]; items[j] = tmp;
        }
      }

      items.forEach((it, pos) => {
        const row = Math.floor(pos / cols);
        const col = pos % cols;
        const palette = MARBLE_PALETTES[it.i % MARBLE_PALETTES.length];
        marbles.push({
          id: it.i + 1,
          num: it.i + 1,
          name: it.name,
          x: startX + col * spacingX + (Math.random() - 0.5) * 14,
          y: usableTop + row * spacingY,
          vx: (Math.random() - 0.5) * 1.4,
          vy: 0,
          r,
          color: palette.main,
          glow: palette.glow,
          finished: false,
          finishTime: 0,
          rank: 0,
          trail: [],
          boostLock: 0,
          portalLock: 0,
          padLock: 0,
          luck: 0.78 + Math.random() * 0.44,
          stuck: 0,
          bestY: 0
        });
      });

      lastRankKey = '';
      renderSidebarList();
      updateMinimap();
      const mapName = currentMap ? currentMap.name : '맵';
      updateBanner(mapName + ' 준비. 스페이스바 또는 레이스 출발.');
    }

    function updatePhysics() {
      const scale = state.timeScale * state.speedMultiplier;
      spinners.forEach(s => { s.angle += s.speed * scale; });
      bumpers.forEach(b => {
        if (b.flashTimer > 0) b.flashTimer--;
        if (b.osc) {
          b.phase += b.osc.speed * scale;
          b.x = b.cx + Math.sin(b.phase) * b.osc.amp;
        }
      });

      if (!state.racing && gateClosed) return;

      const activeMarbles = marbles.filter(m => !m.finished);
      if (activeMarbles.length > 0) {
        const maxY = Math.max(...activeMarbles.map(m => m.y));
        state.timeScale = (maxY > FINISH_LINE_Y - 140 && maxY < FINISH_LINE_Y) ? 0.45 : 1.0;
      } else {
        state.timeScale = 1.0;
      }

      const baseSubSteps = 2;
      const totalSteps = Math.round(baseSubSteps * state.speedMultiplier);
      const dt = state.timeScale / baseSubSteps;
      for (let step = 0; step < totalSteps; step++) updatePhysicsStep(dt);

      if (state.finishRank.length > 0) {
        marbles.forEach(m => {
          if (!m.finished && m.vy < 4) m.vy += 0.12 * dt;
        });
      }

      if (state.racing && !state.finished) {
        const leader = marbles.filter(m => !m.finished).sort((a, b) => b.y - a.y)[0];
        if (leader && ghostPath.length < 400) {
          if (ghostPath.length === 0 || Math.hypot(leader.x - ghostPath[ghostPath.length - 1].x, leader.y - ghostPath[ghostPath.length - 1].y) > 18) {
            ghostPath.push({ x: leader.x, y: leader.y, color: leader.color });
          }
        }
      }

      if (!state.sim) {
        updateLeaderboardOrder();
        updateMinimap();
      }

      if (state.racing && !state.finished && !state.sim) {
        state.elapsedMs = Date.now() - state.startTime;
        const totalSec = Math.floor(state.elapsedMs / 1000);
        const ms = Math.floor((state.elapsedMs % 1000) / 100);
        const min = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const sec = String(totalSec % 60).padStart(2, '0');
        document.getElementById('hudTimer').textContent = `${min}:${sec}.${ms}`;
        const firstFinishMs = state.finishRank[0] ? Number(state.finishRank[0].finishTime) * 1000 : 0;
        if (state.finishRank.length > 0 && firstFinishMs > 0 && (Date.now() - state.startTime) > firstFinishMs + 24000) {
          skipToFinish();
        }
      }
    }

    function updatePhysicsStep(dt) {
      marbles.forEach(m => {
        if (m.finished) return;

        const P = phys();
        m.vy += P.gravity * dt;
        m.vx *= Math.pow(P.friction, dt);
        m.vy *= Math.pow(P.friction, dt);

        zones.forEach(z => {
          if (!inBox(m, z)) return;
          if (z.kind === 'ice') {
            m.vx *= Math.pow(0.9998, dt);
            m.vx += (Math.random() - 0.5) * 1.4 * dt;
          } else if (z.kind === 'sand') {
            m.vx *= Math.pow(0.9, dt);
            m.vy *= Math.pow(0.9, dt);
          } else if (z.kind === 'gust') {
            const t = Date.now() * 0.0018 + (z.phase || 0);
            m.vx += Math.sin(t) * z.power * dt * 0.7;
          }
        });

        conveyors.forEach(c => {
          if (inBox(m, c)) {
            m.vx += c.vx * dt * 0.42;
            m.vy += c.vy * dt * 0.42;
          }
        });

        const speed = Math.hypot(m.vx, m.vy);
        if (speed > P.maxV) {
          m.vx = (m.vx / speed) * P.maxV;
          m.vy = (m.vy / speed) * P.maxV;
        }

        m.x += m.vx * dt;
        m.y += m.vy * dt;

        if (gateClosed && m.y > 300 - m.r) {
          m.y = 300 - m.r;
          m.vy = -Math.abs(m.vy) * 0.3;
        }

        if (m.boostLock > 0) m.boostLock -= 1;
        if (m.portalLock > 0) m.portalLock -= 1;
        if (m.padLock > 0) m.padLock -= 1;

        if (state.racing && !m.finished && m.y > 320) {
          if (m.y > (m.bestY || 0) + 5) {
            m.bestY = m.y;
            m.stuck = 0;
          } else {
            m.stuck = (m.stuck || 0) + 1;
            const stalled = m.stuck > 100;
            const reversed = (m.bestY || 0) - m.y > 240 && m.stuck > 48;
            if (stalled || reversed) {
              m.vy = 3.4 + Math.random() * 2.2;
              m.vx += (Math.random() - 0.5) * 4.2;
              if (m.y < (m.bestY || m.y) - 80) m.y += 18;
              m.stuck = 0;
            }
          }
        } else if (m.y <= 320) {
          m.stuck = 0;
        }

        const leftLimit = -TRACK_HALF_WIDTH + m.r + 2;
        const rightLimit = TRACK_HALF_WIDTH - m.r - 2;
        if (m.x < leftLimit) { m.x = leftLimit; m.vx = Math.abs(m.vx) * 0.5; }
        else if (m.x > rightLimit) { m.x = rightLimit; m.vx = -Math.abs(m.vx) * 0.5; }
        if (m.y < 12 + m.r) { m.y = 12 + m.r; m.vy = Math.abs(m.vy) * 0.3; }

        const speedSq = m.vx * m.vx + m.vy * m.vy;
        if (speedSq > 30) {
          m.trail.push({ x: m.x, y: m.y, alpha: 0.7 });
          if (m.trail.length > 8) m.trail.shift();
        } else if (m.trail.length > 0) m.trail.shift();

        segments.forEach(seg => resolveSegmentCollision(m, seg.x1, seg.y1, seg.x2, seg.y2));

        bumpers.forEach(b => {
          const dx = m.x - b.x;
          const dy = m.y - b.y;
          const dist = Math.hypot(dx, dy);
          const minDist = m.r + b.r;
          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            m.x = b.x + nx * minDist;
            m.y = b.y + ny * minDist;
            const dot = m.vx * nx + m.vy * ny;
            const pow = b.power * P.bounce * (0.75 + m.luck * 0.45);
            m.vx = (m.vx - 2 * dot * nx) * pow;
            m.vy = (m.vy - 2 * dot * ny) * pow;
            m.vx += (Math.random() - 0.5) * (3.2 + m.luck * 2);
            if (Math.random() < 0.22) m.vy *= 0.45;
            else m.vy += (Math.random() - 0.28) * 2.2;
            if (m.vy < -3.2) m.vy = -3.2;
            b.flashTimer = 8;
            playSound('bumper');
            flashEvent(m.name + ' 범퍼');
          }
        });

        spinners.forEach(s => {
          for (let b = 0; b < 4; b++) {
            const a = s.angle + (b * Math.PI) / 2;
            resolveSegmentCollision(m, s.x, s.y, s.x + Math.cos(a) * (s.length / 2), s.y + Math.sin(a) * (s.length / 2), 1.4);
          }
        });

        boosters.forEach(b => {
          if (m.boostLock > 0) return;
          if (inBox(m, b)) {
            m.vy += b.boostVY * (0.55 + Math.random() * 0.7) * m.luck;
            m.vx += (Math.random() - 0.5) * 4.2;
            m.boostLock = 28;
            playSound('booster');
            flashEvent(m.name + ' 가속');
          }
        });

        vortexes.forEach(v => {
          const dx = v.x - m.x;
          const dy = v.y - m.y;
          const dist = Math.hypot(dx, dy);
          if (dist < v.r && dist > 0) {
            const angle = Math.atan2(dy, dx);
            m.vx += Math.cos(angle + Math.PI / 2) * 1.15 * dt;
            if (m.y <= v.y + 8) {
              m.vx += (dx / dist) * v.pull * dt;
              m.vy += (dy / dist) * v.pull * dt;
            } else {
              m.vy += 0.4 * dt;
            }
            if (dist < 36) {
              const jitter = (Math.random() - 0.5) * (v.scatter ? 110 : 24);
              m.x = Math.max(leftLimit, Math.min(rightLimit, m.x + jitter));
              const minAhead = v.r + 90;
              let dest = v.y + Math.max(minAhead, (v.warpY || (v.y + 240)) - v.y);
              if (v.chaos) {
                const roll = Math.random();
                if (roll < 0.35) dest += 180 + Math.random() * 420;
                else if (roll < 0.6) dest = v.y + minAhead + Math.random() * 40;
              }
              dest += (Math.random() - 0.2) * 40;
              m.y = dest;
              m.vy = 3.2 + Math.random() * 3.4;
              m.vx += (Math.random() - 0.5) * 5;
              playSound('vortex');
              flashEvent(m.name + ' 웜홀');
            }
          }
        });

        portals.forEach(p => {
          if (m.portalLock > 0) return;
          const dist = Math.hypot(p.x - m.x, p.y - m.y);
          if (dist < p.r) {
            const jx = p.scramble ? (Math.random() - 0.5) * 70 : 0;
            m.x = Math.max(leftLimit, Math.min(rightLimit, p.tx + jx));
            m.y = Math.max(m.y + 40, p.ty + (p.scramble ? (Math.random() - 0.5) * 50 : 0));
            m.portalLock = 40;
            m.vy = 2.4 + Math.random() * 3.5;
            m.vx += (Math.random() - 0.5) * 4;
            if (!p.silent) {
              playSound('vortex');
              flashEvent(m.name + ' 포탈');
            }
          }
        });

        pads.forEach(p => {
          if (m.padLock > 0) return;
          if (!inBox(m, p)) return;
          if (p.kind === 'jump') {
            const power = p.jitter ? p.power * (0.55 + Math.random() * 0.9) : p.power;
            m.vy += power * (0.8 + m.luck * 0.4);
            m.vx += (Math.random() - 0.5) * (p.jitter ? 5 : 2);
          } else if (p.kind === 'cannon') {
            const j = p.jitter ? (0.6 + Math.random() * 0.8) : 1;
            m.vx = p.vx * j * (Math.random() < 0.15 ? -1 : 1);
            m.vy += p.vy * (0.7 + Math.random() * 0.6);
          } else if (p.kind === 'luck') {
            const roll = Math.random();
            if (roll < 0.4) {
              m.vy += 6.5 * m.luck;
              flashEvent(m.name + ' 대박 가속');
            } else if (roll < 0.7) {
              m.vy *= 0.25;
              m.vx += (Math.random() - 0.5) * 6;
              flashEvent(m.name + ' 슬로우');
            } else {
              m.vx = (Math.random() < 0.5 ? -1 : 1) * (6 + Math.random() * 4);
              m.vy += 3;
              flashEvent(m.name + ' 옆치기');
            }
          }
          m.padLock = 30;
          playSound('booster');
          if (p.kind !== 'luck') flashEvent(m.name + (p.kind === 'jump' ? ' 점프' : ' 대포'));
        });

        marbles.forEach(other => {
          if (m.id >= other.id) return;
          const dx = other.x - m.x;
          const dy = other.y - m.y;
          const dist = Math.hypot(dx, dy);
          const minDist = m.r + other.r;
          if (dist < minDist && dist > 0) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = minDist - dist;
            m.x -= nx * overlap * 0.5;
            m.y -= ny * overlap * 0.5;
            other.x += nx * overlap * 0.5;
            other.y += ny * overlap * 0.5;
            const kx = m.vx - other.vx;
            const ky = m.vy - other.vy;
            const p = nx * kx + ny * ky;
            m.vx -= p * nx * RESTITUTION;
            m.vy -= p * ny * RESTITUTION;
            other.vx += p * nx * RESTITUTION;
            other.vy += p * ny * RESTITUTION;
            if (Math.hypot(kx, ky) > 2) playSound('clack', Math.hypot(kx, ky));
          }
        });

        if (m.x < leftLimit) { m.x = leftLimit; m.vx = Math.abs(m.vx) * 0.5; }
        else if (m.x > rightLimit) { m.x = rightLimit; m.vx = -Math.abs(m.vx) * 0.5; }
        if (m.y < 12 + m.r) { m.y = 12 + m.r; m.vy = Math.abs(m.vy) * 0.3; }

        if (m.y >= FINISH_LINE_Y && !m.finished) {
          m.finished = true;
          m.finishTime = ((Date.now() - state.startTime) / 1000).toFixed(2);
          state.finishRank.push(m);
          m.rank = state.finishRank.length;
          if (m.rank === 1) {
            playSound('fanfare');
            triggerConfetti();
            lastGhost = { color: m.color, name: m.name, path: ghostPath.slice() };
          }
          if (state.finishRank.length === marbles.length) endRace();
        }
      });
    }

    function resolveSegmentCollision(m, x1, y1, x2, y2, bounciness = 1.25) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy;
      if (lenSq === 0) return;
      const u = Math.max(0, Math.min(1, ((m.x - x1) * dx + (m.y - y1) * dy) / lenSq));
      const cx = x1 + u * dx;
      const cy = y1 + u * dy;
      const dist = Math.hypot(m.x - cx, m.y - cy);
      if (dist < m.r && dist > 0) {
        const nx = (m.x - cx) / dist;
        const ny = (m.y - cy) / dist;
        m.x = cx + nx * m.r;
        m.y = cy + ny * m.r;
        const dot = m.vx * nx + m.vy * ny;
        if (dot < 0) {
          m.vx = (m.vx - 2 * dot * nx) * bounciness;
          m.vy = (m.vy - 2 * dot * ny) * bounciness;
          playSound('clack', Math.hypot(m.vx, m.vy));
        }
      }
    }

    function updateLeaderboardOrder() {
      marbles.sort((a, b) => {
        if (a.finished && b.finished) return a.rank - b.rank;
        if (a.finished) return -1;
        if (b.finished) return 1;
        return b.y - a.y;
      });
      renderSidebarList();
    }

    let lastRankKey = '';
    function renderSidebarList() {
      const listEl = document.getElementById('rankList');
      const key = marbles.map(m => `${m.id}:${m.finished ? m.rank : 0}:${Math.floor(m.y / 40)}`).join('|');
      if (key === lastRankKey && listEl.childElementCount === marbles.length) {
        const times = listEl.querySelectorAll('.rank-time');
        marbles.forEach((m, idx) => {
          if (times[idx]) times[idx].textContent = m.finished ? `${m.finishTime}초` : '';
        });
        return;
      }
      lastRankKey = key;
      listEl.replaceChildren();
      let finishedCount = 0;
      marbles.forEach((m, idx) => {
        const currentRank = m.finished ? m.rank : idx + 1;
        if (m.finished) finishedCount++;
        const item = document.createElement('div');
        item.className = 'rank-item';
        if (currentRank === 1) item.classList.add('top-1');
        else if (currentRank === 2) item.classList.add('top-2');
        else if (currentRank === 3) item.classList.add('top-3');
        if (m.finished) item.classList.add('finished');
        if (cameraControl.focusedMarble === m) item.classList.add('focused');
        item.title = `${m.name} 추적`;
        item.addEventListener('click', () => focusMarble(m));
        const badge = document.createElement('div');
        badge.className = 'rank-badge';
        badge.textContent = String(currentRank);
        const dot = document.createElement('div');
        dot.className = 'marble-dot-preview';
        dot.style.background = m.color;
        dot.style.color = m.glow;
        const nameEl = document.createElement('div');
        nameEl.className = 'rank-name';
        nameEl.textContent = m.name;
        const timeEl = document.createElement('div');
        timeEl.className = 'rank-time';
        timeEl.textContent = m.finished ? `${m.finishTime}초` : '';
        item.append(badge, dot, nameEl, timeEl);
        listEl.appendChild(item);
      });
      document.getElementById('aliveCount').textContent = `완주: ${finishedCount} / ${marbles.length}명`;
    }

    function updateMinimap() {
      const trackEl = document.getElementById('minimapTrack');
      trackEl.querySelectorAll('.minimap-dot').forEach(d => d.remove());
      marbles.forEach(m => {
        const dot = document.createElement('div');
        dot.className = 'minimap-dot';
        const progress = Math.min(1, Math.max(0, m.y / FINISH_LINE_Y));
        dot.style.top = `${progress * 100}%`;
        dot.style.background = m.color;
        dot.style.color = m.glow;
        trackEl.appendChild(dot);
      });
    }

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
      }
      ctx.save();
      ctx.scale(dpr, dpr);
      const viewW = rect.width;
      const viewH = rect.height;
      const scale = Math.min(viewW / (TRACK_WIDTH + 140), 1.25);
      const centerX = viewW / 2;
      const rail = (currentMap && currentMap.rail) || '#0284c7';

      if (!cameraControl.manual) {
        let targetY = FINISH_LINE_Y;
        if (cameraControl.focusedMarble) targetY = cameraControl.focusedMarble.y;
        else {
          const active = marbles.filter(m => !m.finished);
          if (active.length > 0) {
            const leaders = active.slice(0, 3);
            targetY = leaders.reduce((acc, cur) => acc + cur.y, 0) / leaders.length;
          }
        }
        const minCamY = (viewH * 0.35) / scale;
        const maxCamY = FINISH_LINE_Y + 120;
        targetY = Math.max(minCamY, Math.min(maxCamY, targetY));
        cameraY += (targetY - cameraY) * 0.095;
      }

      ctx.clearRect(0, 0, viewW, viewH);
      ctx.save();
      ctx.translate(centerX, viewH * 0.45);
      ctx.scale(scale, scale);
      ctx.translate(0, -cameraY);

      const gradFloor = ctx.createLinearGradient(-TRACK_HALF_WIDTH, 0, TRACK_HALF_WIDTH, 0);
      gradFloor.addColorStop(0, '#090d16');
      gradFloor.addColorStop(0.5, '#131e36');
      gradFloor.addColorStop(1, '#090d16');
      ctx.fillStyle = gradFloor;
      ctx.fillRect(-TRACK_HALF_WIDTH, 0, TRACK_WIDTH, TRACK_HEIGHT);

      ctx.strokeStyle = 'rgba(255,255,255,0.035)';
      ctx.lineWidth = 3;
      for (let y = 100; y < TRACK_HEIGHT; y += 120) {
        ctx.beginPath();
        ctx.moveTo(-160, y);
        ctx.lineTo(0, y + 40);
        ctx.lineTo(160, y);
        ctx.stroke();
      }

      zones.forEach(z => {
        ctx.save();
        ctx.translate(z.x, z.y);
        const zFill = z.kind === 'ice' ? 'rgba(125,211,252,0.16)' : z.kind === 'gust' ? 'rgba(167,139,250,0.14)' : 'rgba(180,83,9,0.22)';
        const zInk = z.kind === 'ice' ? '#bae6fd' : z.kind === 'gust' ? '#ddd6fe' : '#fdba74';
        const zLabel = z.kind === 'ice' ? '얼음' : z.kind === 'gust' ? '돌풍' : '모래';
        ctx.fillStyle = zFill;
        ctx.fillRect(-z.w / 2, -z.h / 2, z.w, z.h);
        ctx.fillStyle = zInk;
        ctx.font = '800 16px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(zLabel, 0, 0);
        ctx.restore();
      });

      conveyors.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.fillStyle = 'rgba(251,191,36,0.14)';
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.strokeRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.fillStyle = '#fde68a';
        ctx.font = '800 14px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(c.vy < 0 ? '붙잡기' : (c.vx < 0 ? '← 벨트' : '벨트 →'), 0, 0);
        ctx.restore();
      });

      pads.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.fillStyle = p.kind === 'jump' ? 'rgba(52,211,153,0.22)' : p.kind === 'luck' ? 'rgba(244,114,182,0.22)' : 'rgba(251,146,60,0.22)';
        ctx.strokeStyle = p.kind === 'jump' ? '#34d399' : p.kind === 'luck' ? '#f472b6' : '#fb923c';
        ctx.lineWidth = 3;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.fillStyle = '#fff';
        ctx.font = '800 14px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.kind === 'jump' ? '점프' : p.kind === 'luck' ? '운' : '대포', 0, 0);
        ctx.restore();
      });

      ctx.lineWidth = 14;
      ctx.strokeStyle = rail;
      ctx.shadowColor = rail;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(-TRACK_HALF_WIDTH, 0);
      ctx.lineTo(-TRACK_HALF_WIDTH, TRACK_HEIGHT);
      ctx.moveTo(TRACK_HALF_WIDTH, 0);
      ctx.lineTo(TRACK_HALF_WIDTH, TRACK_HEIGHT);
      ctx.stroke();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#bae6fd';
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.lineWidth = 10;
      ctx.lineCap = 'round';
      segments.forEach(s => {
        if (s.x1 === -TRACK_HALF_WIDTH && s.x2 === -TRACK_HALF_WIDTH) return;
        if (s.x1 === TRACK_HALF_WIDTH && s.x2 === TRACK_HALF_WIDTH) return;
        ctx.strokeStyle = rail;
        ctx.shadowColor = rail;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      });

      if (gateClosed) {
        ctx.strokeStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 20;
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(-TRACK_HALF_WIDTH + 10, 300);
        ctx.lineTo(TRACK_HALF_WIDTH - 10, 300);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fca5a5';
        ctx.font = '900 22px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('출발 게이트', 0, 282);
      }

      boosters.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.fillStyle = 'rgba(6,182,212,0.22)';
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 16;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.fillStyle = '#67e8f9';
        ctx.font = '900 16px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('가속', 0, 0);
        ctx.restore();
      });

      vortexes.forEach(v => {
        ctx.save();
        ctx.translate(v.x, v.y);
        ctx.rotate(Date.now() * 0.0035);
        const vGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, v.r);
        vGrad.addColorStop(0, '#000');
        vGrad.addColorStop(0.4, '#581c87');
        vGrad.addColorStop(0.8, '#a855f7');
        vGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = vGrad;
        ctx.beginPath();
        ctx.arc(0, 0, v.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 18;
        for (let a = 0; a < 3; a++) {
          ctx.beginPath();
          ctx.arc(0, 0, v.r * 0.7, a * (Math.PI * 2 / 3), a * (Math.PI * 2 / 3) + 1.2);
          ctx.stroke();
        }
        ctx.restore();
      });

      portals.forEach(p => {
        if (p.silent) return;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.strokeStyle = p.hue;
        ctx.shadowColor = p.hue;
        ctx.shadowBlur = 16;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = p.hue;
        ctx.font = '800 13px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('포탈', 0, 0);
        ctx.restore();
      });

      spinners.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        ctx.strokeStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        for (let b = 0; b < 4; b++) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(s.length / 2, 0);
          ctx.stroke();
          ctx.rotate(Math.PI / 2);
        }
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      bumpers.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        const isFlashing = b.flashTimer > 0;
        const scaleMul = isFlashing ? 1.25 : 1.0;
        ctx.scale(scaleMul, scaleMul);
        ctx.fillStyle = isFlashing ? '#fff' : (b.isMega ? '#f43f5e' : '#38bdf8');
        ctx.shadowColor = b.isMega ? '#f43f5e' : '#38bdf8';
        ctx.shadowBlur = isFlashing ? 25 : (b.isMega ? 16 : 8);
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(0, 0, b.r * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      const boxSize = 24;
      const count = Math.floor(TRACK_WIDTH / boxSize);
      for (let i = 0; i < count; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#fff' : '#000';
        ctx.fillRect(-TRACK_HALF_WIDTH + i * boxSize, FINISH_LINE_Y - 10, boxSize, 20);
      }
      ctx.fillStyle = '#10b981';
      ctx.font = '900 30px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#10b981';
      ctx.shadowBlur = 20;
      ctx.fillText('결승선', 0, FINISH_LINE_Y - 26);
      ctx.shadowBlur = 0;

      if (lastGhost && lastGhost.path) {
        ctx.globalAlpha = 0.28;
        lastGhost.path.forEach(pt => {
          ctx.fillStyle = lastGhost.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      marbles.forEach(m => {
        ctx.save();
        ctx.translate(m.x, m.y);
        m.trail.forEach((t, tidx) => {
          ctx.save();
          ctx.globalAlpha = t.alpha * (tidx / m.trail.length);
          ctx.fillStyle = m.color;
          ctx.beginPath();
          ctx.arc(t.x - m.x, t.y - m.y, m.r * 0.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath();
        ctx.arc(3, 5, m.r, 0, Math.PI * 2);
        ctx.fill();
        const grad = ctx.createRadialGradient(-m.r * 0.35, -m.r * 0.35, m.r * 0.08, 0, 0, m.r);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.25, m.glow);
        grad.addColorStop(0.55, m.color);
        grad.addColorStop(1, '#000');
        ctx.fillStyle = grad;
        ctx.shadowColor = m.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, m.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, m.r - 2, Math.PI * 1.05, Math.PI * 1.55);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 4;
        ctx.font = '900 16px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(m.num, 0, 1);
        ctx.shadowBlur = 0;
        ctx.font = '800 12px Pretendard, sans-serif';
        ctx.textBaseline = 'bottom';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3.5;
        ctx.strokeText(m.name, 0, -m.r - 4);
        ctx.fillStyle = '#fff';
        ctx.fillText(m.name, 0, -m.r - 4);
        ctx.restore();
      });

      ctx.restore();
      ctx.restore();
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }

    function showCount(n) {
      const el = document.getElementById('countOverlay');
      if (!el) return;
      el.textContent = n;
      el.classList.add('show');
      if (n === '출발') setTimeout(() => el.classList.remove('show'), 450);
    }

    function startRace() {
      if (state.racing || state.countingDown) return;
      const gen = ++raceGen;
      state.countingDown = true;
      state.finished = false;
      document.getElementById('btnStartRace').disabled = true;
      document.getElementById('btnSkipFinish').style.display = 'inline-flex';
      initMarbles();
      updateBanner('3초 뒤 출발 · 3');
      showCount('3');
      playSound('clack', 12);
      setTimeout(() => { if (gen !== raceGen) return; updateBanner('출발 카운트다운 · 2'); showCount('2'); playSound('clack', 16); }, 1000);
      setTimeout(() => { if (gen !== raceGen) return; updateBanner('출발 카운트다운 · 1'); showCount('1'); playSound('clack', 20); }, 2000);
      setTimeout(() => {
        if (gen !== raceGen) return;
        showCount('출발');
        updateBanner((currentMap ? currentMap.name : '') + ' 출발');
        gateClosed = false;
        state.countingDown = false;
        state.racing = true;
        state.startTime = Date.now();
        playSound('booster');
      }, 3000);
    }

    function endRace() {
      state.racing = false;
      state.finished = true;
      if (state.sim) return;
      document.getElementById('btnStartRace').disabled = false;
      document.getElementById('btnSkipFinish').style.display = 'none';
      updateBanner('모든 구슬이 결승선을 통과했습니다.');
      setTimeout(() => showPodium(), 1000);
    }

    function fillPodiumBoard(highlightLast) {
      const board = document.getElementById('podiumBoard');
      board.replaceChildren();
      const lastRank = state.finishRank.length;
      state.finishRank.forEach(m => {
        const row = document.createElement('div');
        row.className = 'podium-row';
        if (m.rank <= 3) row.classList.add('top');
        if (highlightLast && m.rank === lastRank) row.classList.add('last');
        const rankEl = document.createElement('span');
        rankEl.className = 'podium-row-rank';
        rankEl.textContent = `${m.rank}위`;
        const nameEl = document.createElement('span');
        nameEl.className = 'podium-row-name';
        nameEl.textContent = m.name;
        const timeEl = document.createElement('span');
        timeEl.className = 'podium-row-time';
        timeEl.textContent = `${m.finishTime}초`;
        row.append(rankEl, nameEl, timeEl);
        board.appendChild(row);
      });
    }

    function showPodium() {
      const top1 = state.finishRank[0];
      const top2 = state.finishRank[1];
      const top3 = state.finishRank[2];
      const last = state.finishRank[state.finishRank.length - 1];
      document.getElementById('podiumName1').textContent = top1 ? top1.name : '-';
      document.getElementById('podiumTime1').textContent = top1 ? `${top1.finishTime}초` : '';
      document.getElementById('podiumName2').textContent = top2 ? top2.name : '-';
      document.getElementById('podiumTime2').textContent = top2 ? `${top2.finishTime}초` : '';
      document.getElementById('podiumName3').textContent = top3 ? top3.name : '-';
      document.getElementById('podiumTime3').textContent = top3 ? `${top3.finishTime}초` : '';
      const stands = document.getElementById('podiumStands');
      const hero = document.getElementById('podiumHero');
      const mapBit = currentMap ? currentMap.name : '';
      const punish = state.gameMode === 'punishment';
      const survival = state.gameMode === 'survival';

      if (punish) {
        stands.classList.add('is-hidden');
        hero.classList.add('show', 'last');
        document.getElementById('podiumHeroLabel').textContent = '꼴찌 · 당번';
        document.getElementById('podiumHeroName').textContent = last ? last.name : '-';
        document.getElementById('podiumHeroMeta').textContent = last ? `${last.finishTime}초 · ${mapBit}` : mapBit;
        document.getElementById('podiumTitleText').textContent = '꼴찌 결정';
        document.getElementById('podiumMessage').textContent = last ? `마지막으로 들어온 구슬은 ${last.name}입니다.` : '결과를 확정하지 못했습니다.';
      } else if (survival) {
        stands.classList.add('is-hidden');
        hero.classList.add('show');
        hero.classList.remove('last');
        document.getElementById('podiumHeroLabel').textContent = '발표자';
        document.getElementById('podiumHeroName').textContent = top1 ? top1.name : '-';
        document.getElementById('podiumHeroMeta').textContent = top1 ? `${top1.finishTime}초 · ${mapBit}` : mapBit;
        document.getElementById('podiumTitleText').textContent = '발표자 1명';
        document.getElementById('podiumMessage').textContent = top1 ? `오늘 발표자는 ${top1.name}입니다.` : '결과를 확정하지 못했습니다.';
      } else {
        stands.classList.remove('is-hidden');
        hero.classList.remove('show', 'last');
        document.getElementById('podiumTitleText').textContent = '1~3위';
        document.getElementById('podiumMessage').textContent = mapBit
          ? (top1 ? `${mapBit} · 1위 ${top1.name}` : mapBit)
          : (top1 ? `1위 ${top1.name}` : '결과를 확정하지 못했습니다.');
      }
      fillPodiumBoard(punish);
      document.getElementById('podiumModal').classList.add('open');
      playSound('fanfare');
      triggerConfetti();
    }

    function closePodium() { document.getElementById('podiumModal').classList.remove('open'); }
    function restartFromPodium() { closePodium(); startRace(); }
    function restartOtherMap() { closePodium(); pickRandomMap(); startRace(); }
    function updateBanner(text) { document.getElementById('bannerText').textContent = text; }
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    function copyResults() {
      if (!state.finishRank.length) return;
      const lines = state.finishRank.map(m => `${m.rank}위\t${m.name}\t${m.finishTime}초`);
      const header = (currentMap ? currentMap.name : '레이스') + '\n';
      const text = header + lines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => updateBanner('순위를 복사했습니다.')).catch(() => {});
      }
    }

    function resetRace() {
      raceGen += 1;
      state.racing = false;
      state.countingDown = false;
      state.finished = false;
      document.getElementById('btnStartRace').disabled = false;
      document.getElementById('btnSkipFinish').style.display = 'none';
      const overlay = document.getElementById('countOverlay');
      if (overlay) overlay.classList.remove('show');
      closePodium();
      initMarbles();
      resumeAutoFollow();
    }

    document.addEventListener('DOMContentLoaded', () => {
      let savedMap = 'stadium';
      try { savedMap = localStorage.getItem(MAP_KEY) || 'stadium'; } catch (e) {}
      currentMap = MAPS.find(m => m.id === savedMap) || MAPS[0];
      buildTrack();
      initMarbles();
      updateMapChips();
      document.getElementById('rosterBtnText').textContent = `참가자 명단 (${state.names.length}명)`;
      requestAnimationFrame(loop);

      document.getElementById('btnStartRace').addEventListener('click', startRace);
      document.getElementById('btnResetRace').addEventListener('click', resetRace);
      document.getElementById('btnSkipFinish').addEventListener('click', skipToFinish);
      document.getElementById('btnCopyResults').addEventListener('click', copyResults);
      document.getElementById('btnRandomMap').addEventListener('click', pickRandomMap);
      document.getElementById('btnShuffle').addEventListener('click', () => {
        if (state.racing || state.countingDown) return;
        state.shuffleStart = !state.shuffleStart;
        document.getElementById('btnShuffle').classList.toggle('active', state.shuffleStart);
        initMarbles();
      });
      document.getElementById('btnBigMarbles').addEventListener('click', () => {
        if (state.racing || state.countingDown) return;
        state.bigMarbles = !state.bigMarbles;
        document.getElementById('btnBigMarbles').classList.toggle('active', state.bigMarbles);
        initMarbles();
      });

      document.querySelectorAll('.map-chip').forEach(btn => {
        btn.addEventListener('click', () => setMap(btn.dataset.map));
      });

      document.querySelectorAll('.btn-speed').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.btn-speed').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.speedMultiplier = parseFloat(btn.dataset.speed) || 1.0;
        });
      });

      canvas.addEventListener('mousedown', (e) => {
        cameraControl.isDragging = true;
        cameraControl.manual = true;
        cameraControl.focusedMarble = null;
        cameraControl.dragStartY = e.clientY;
        cameraControl.dragCamStartY = cameraY;
        canvas.style.cursor = 'grabbing';
        updateCameraBadge();
      });
      window.addEventListener('mousemove', (e) => {
        if (!cameraControl.isDragging) return;
        const dy = e.clientY - cameraControl.dragStartY;
        const rect = canvas.getBoundingClientRect();
        const scale = Math.min(rect.width / (TRACK_WIDTH + 140), 1.25);
        cameraY = Math.max(100, Math.min(TRACK_HEIGHT, cameraControl.dragCamStartY - dy / scale));
      });
      window.addEventListener('mouseup', () => {
        if (cameraControl.isDragging) {
          cameraControl.isDragging = false;
          canvas.style.cursor = 'grab';
        }
      });
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        cameraControl.manual = true;
        cameraControl.focusedMarble = null;
        const rect = canvas.getBoundingClientRect();
        const scale = Math.min(rect.width / (TRACK_WIDTH + 140), 1.25);
        cameraY = Math.max(100, Math.min(TRACK_HEIGHT, cameraY + (e.deltaY * 0.9) / scale));
        updateCameraBadge();
      }, { passive: false });
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          cameraControl.isDragging = true;
          cameraControl.manual = true;
          cameraControl.focusedMarble = null;
          cameraControl.dragStartY = e.touches[0].clientY;
          cameraControl.dragCamStartY = cameraY;
          updateCameraBadge();
        }
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (!cameraControl.isDragging || e.touches.length !== 1) return;
        const dy = e.touches[0].clientY - cameraControl.dragStartY;
        const rect = canvas.getBoundingClientRect();
        const scale = Math.min(rect.width / (TRACK_WIDTH + 140), 1.25);
        cameraY = Math.max(100, Math.min(TRACK_HEIGHT, cameraControl.dragCamStartY - dy / scale));
      }, { passive: true });
      window.addEventListener('touchend', () => { cameraControl.isDragging = false; });

      document.getElementById('btnToggleSound').addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        document.getElementById('soundIcon').textContent = state.soundEnabled ? '🔊' : '🔇';
        document.getElementById('soundText').textContent = state.soundEnabled ? '효과음' : '음소거';
        document.getElementById('btnToggleSound').classList.toggle('active', state.soundEnabled);
      });
      document.getElementById('modeSelect').addEventListener('change', (e) => { state.gameMode = e.target.value; });
      document.getElementById('btnFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
        else document.exitFullscreen().catch(() => {});
      });
      document.getElementById('btnOpenRoster').addEventListener('click', () => {
        document.getElementById('rosterInput').value = state.names.join('\n');
        openModal('modalRoster');
      });
      document.getElementById('btnLoadNumbers20').addEventListener('click', () => {
        document.getElementById('rosterInput').value = Array.from({ length: 20 }, (_, i) => `${i + 1}번 구슬`).join('\n');
      });
      document.getElementById('btnLoadNumbers30').addEventListener('click', () => {
        document.getElementById('rosterInput').value = Array.from({ length: 30 }, (_, i) => `${i + 1}번 구슬`).join('\n');
      });
      document.getElementById('btnLoadGroups6').addEventListener('click', () => {
        document.getElementById('rosterInput').value = ['1모둠','2모둠','3모둠','4모둠','5모둠','6모둠'].join('\n');
      });
      document.getElementById('btnLoadRainbow12').addEventListener('click', () => {
        document.getElementById('rosterInput').value = ['빨강','주황','노랑','초록','파랑','남색','보라','루비','에메랄드','사파이어','토파즈','다이아'].join('\n');
      });
      document.getElementById('btnSaveRoster').addEventListener('click', () => {
        const valid = document.getElementById('rosterInput').value.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (valid.length < 2) { alert('최소 2명 이상의 참가자를 입력해주세요.'); return; }
        state.names = valid;
        localStorage.setItem(ROSTER_KEY, JSON.stringify(state.names));
        document.getElementById('rosterBtnText').textContent = `참가자 명단 (${state.names.length}명)`;
        closeModal('modalRoster');
        initMarbles();
      });

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          if (cameraControl.manual || cameraControl.focusedMarble) resumeAutoFollow();
          else if (!state.racing && !state.countingDown) startRace();
        } else if (e.code === 'Enter') {
          if (state.racing && !state.finished) skipToFinish();
        } else if (e.code === 'Escape') {
          resumeAutoFollow();
        } else if (e.code === 'KeyM' && !state.racing && !state.countingDown) {
          pickRandomMap();
        } else if (e.code === 'KeyS' && !state.racing && !state.countingDown) {
          document.getElementById('btnShuffle').click();
        } else if (/^Digit[1-8]$/.test(e.code) && !state.racing && !state.countingDown) {
          const idx = Number(e.code.replace('Digit', '')) - 1;
          if (MAPS[idx]) setMap(MAPS[idx].id);
        }
      });
    });

  </script>
</body>
</html>
