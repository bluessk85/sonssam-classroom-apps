<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교실 신호등 | 활동 신호와 큰 타이머</title>
  <meta name="description" content="수업 중 초록·노랑·빨강 신호와 큰 타이머로 활동·정리·정지를 교실 TV에 띄웁니다. 로그인 없이 브라우저에서만 동작합니다." />
  <meta property="og:title" content="교실 신호등 | 손쌤 에듀테크" />
  <meta property="og:description" content="교실 TV용 활동 신호등. 개인·짝·모둠·발표 모드와 초·분 타이머, 종료 알림." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
  <script src="../common-nav.js" defer></script>
  <style>
    :root {
      --bg: #071018;
      --card: rgba(15, 23, 42, 0.78);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
      --go: #22c55e;
      --go-deep: #166534;
      --warn: #facc15;
      --warn-deep: #854d0e;
      --stop: #f43f5e;
      --stop-deep: #9f1239;
      --accent: #38bdf8;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(34, 197, 94, 0.12) 0%, transparent 36%),
        radial-gradient(circle at 80% 8%, rgba(250, 204, 21, 0.1) 0%, transparent 32%),
        linear-gradient(180deg, #122033 0%, #071018 58%, #020617 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header.app-header {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 46px; height: 46px;
      border-radius: 14px;
      display: grid; place-items: center;
      font-size: 24px;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.24), rgba(250, 204, 21, 0.2));
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .brand h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
    .brand p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px;
      border-radius: 11px;
      border: 1px solid transparent;
      font: inherit; font-size: 14px; font-weight: 800;
      cursor: pointer; user-select: none;
      min-height: 44px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--border);
      color: var(--text);
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
    }
    main.stage {
      flex: 1;
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 18px 16px 28px;
      display: grid;
      gap: 18px;
    }
    .board {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 22px 16px 28px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    .lights {
      display: flex;
      justify-content: center;
      gap: clamp(16px, 4vw, 40px);
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .light {
      width: min(28vw, 180px);
      height: min(28vw, 180px);
      min-width: 108px;
      min-height: 108px;
      border-radius: 50%;
      border: 6px solid rgba(255, 255, 255, 0.08);
      background: #111827;
      color: #64748b;
      font: inherit;
      font-size: clamp(15px, 2.4vw, 22px);
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 10px;
      box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.45);
    }
    .light:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .light.go.on {
      background: radial-gradient(circle at 35% 30%, #86efac, var(--go) 55%, var(--go-deep));
      color: #052e16;
      border-color: #bbf7d0;
      box-shadow: 0 0 42px rgba(34, 197, 94, 0.45);
    }
    .light.warn.on {
      background: radial-gradient(circle at 35% 30%, #fef08a, var(--warn) 55%, var(--warn-deep));
      color: #422006;
      border-color: #fde68a;
      box-shadow: 0 0 42px rgba(250, 204, 21, 0.4);
    }
    .light.stop.on {
      background: radial-gradient(circle at 35% 30%, #fda4af, var(--stop) 55%, var(--stop-deep));
      color: #fff;
      border-color: #fecdd3;
      box-shadow: 0 0 42px rgba(244, 63, 94, 0.42);
    }
    .now-label {
      text-align: center;
      font-size: clamp(28px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: -0.03em;
      min-height: 1.2em;
      margin: 4px 0 10px;
    }
    .now-label.go { color: #86efac; }
    .now-label.warn { color: #fde68a; }
    .now-label.stop { color: #fda4af; }
    .timer {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: clamp(64px, 16vw, 160px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 8px 0 6px;
    }
    .timer.ended { color: #fda4af; }
    .activity {
      font-size: clamp(18px, 3.4vw, 32px);
      font-weight: 800;
      text-align: center;
      color: #e2e8f0;
      min-height: 1.3em;
      margin-bottom: 16px;
    }
    .chips, .presets {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .chip, .preset {
      border: 1.5px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      min-height: 44px;
    }
    .chip.active, .preset.active {
      color: #0f172a;
      background: var(--accent);
      border-color: transparent;
    }
    .chip:focus-visible, .preset:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .custom-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .custom-row label { font-size: 14px; font-weight: 700; color: var(--muted); }
    .custom-row input, .task-row input {
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      min-height: 44px;
    }
    .custom-row input { width: 88px; text-align: center; }
    .task-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .task-row input { width: min(520px, 100%); }
    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 14px;
      line-height: 1.5;
    }
    body.signal-go { background-color: #052e16; }
    body.signal-warn { background-color: #422006; }
    body.signal-stop { background-color: #4c0519; }
    @media (max-width: 720px) {
      header.app-header { padding: 10px 12px; }
      .brand h1 { font-size: 17px; }
      .lights { gap: 10px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">🚦</div>
      <div>
        <h1>교실 신호등</h1>
        <p>활동 · 정리 · 정지 신호와 큰 타이머</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="btn btn-ghost" id="autoBtn" aria-pressed="true">자동 노랑 켜짐</button>
      <button type="button" class="btn btn-ghost" id="soundBtn" aria-pressed="true">소리 켜짐</button>
    </div>
  </header>

  <main class="stage">
    <section class="board" aria-label="교실 신호와 타이머">
      <div class="lights" role="group" aria-label="활동 신호">
        <button type="button" class="light go on" data-signal="go" id="lightGo">시작<br>하세요</button>
        <button type="button" class="light warn" data-signal="warn" id="lightWarn">정리<br>하세요</button>
        <button type="button" class="light stop" data-signal="stop" id="lightStop">멈추세요</button>
      </div>
      <p class="now-label go" id="nowLabel">지금 하세요</p>
      <p class="timer" id="timerView" aria-live="polite">05:00</p>
      <p class="activity" id="activityView">모둠 활동</p>
      <div class="chips" role="group" aria-label="활동 종류">
        <button type="button" class="chip" data-activity="개인 활동">개인</button>
        <button type="button" class="chip" data-activity="짝 활동">짝</button>
        <button type="button" class="chip active" data-activity="모둠 활동">모둠</button>
        <button type="button" class="chip" data-activity="발표">발표</button>
        <button type="button" class="chip" data-activity="이동">이동</button>
        <button type="button" class="chip" data-activity="정리">정리</button>
      </div>
      <div class="presets" role="group" aria-label="시간 미리 정하기">
        <button type="button" class="preset" data-sec="60">1분</button>
        <button type="button" class="preset" data-sec="120">2분</button>
        <button type="button" class="preset" data-sec="180">3분</button>
        <button type="button" class="preset active" data-sec="300">5분</button>
        <button type="button" class="preset" data-sec="600">10분</button>
      </div>
      <div class="controls">
        <button type="button" class="btn btn-primary" id="startBtn">시작</button>
        <button type="button" class="btn btn-ghost" id="resetBtn">다시 맞추기</button>
      </div>
      <div class="custom-row">
        <label for="customMin">직접 분</label>
        <input id="customMin" type="number" min="1" max="60" value="5" inputmode="numeric" />
        <button type="button" class="btn btn-ghost" id="applyMin">적용</button>
      </div>
      <div class="task-row">
        <label class="visually-hidden" for="taskInput">지금 하는 일</label>
        <input id="taskInput" type="text" maxlength="40" placeholder="지금 하는 일 (예: 광고 표 채우기)" />
      </div>
      <p class="hint">
        키 1 초록 · 2 노랑 · 3 빨강 · 스페이스 시작/멈춤 · R 다시.<br>
        학생 이름은 받지 않습니다. 시간은 이 브라우저 화면에만 있습니다.
      </p>
    </section>
  </main>

  <style>
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>

  <script>
    const LABELS = { go: "지금 하세요", warn: "정리하세요", stop: "멈추세요" };
    const state = {
      signal: "go",
      activity: "모둠 활동",
      total: 300,
      left: 300,
      running: false,
      auto: true,
      sound: true,
      tick: null,
      ended: false,
    };

    const timerView = document.getElementById("timerView");
    const nowLabel = document.getElementById("nowLabel");
    const activityView = document.getElementById("activityView");
    const startBtn = document.getElementById("startBtn");
    const autoBtn = document.getElementById("autoBtn");
    const soundBtn = document.getElementById("soundBtn");
    const taskInput = document.getElementById("taskInput");

    function pad(n) { return String(n).padStart(2, "0"); }
    function fmt(sec) {
      const s = Math.max(0, sec);
      return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
    }

    function muted() {
      return typeof window.isSonssamAudioMuted === "function" && window.isSonssamAudioMuted();
    }

    function chime() {
      if (!state.sound || muted()) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [523, 659, 784].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.12, now + 0.02 + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35 + i * 0.12);
        o.connect(g); g.connect(ctx.destination);
        o.start(now + i * 0.12);
        o.stop(now + 0.4 + i * 0.12);
      });
    }

    function setSignal(next, fromAuto) {
      state.signal = next;
      document.querySelectorAll(".light").forEach((el) => {
        el.classList.toggle("on", el.dataset.signal === next);
      });
      nowLabel.textContent = LABELS[next];
      nowLabel.className = `now-label ${next}`;
      document.body.className = `signal-${next}`;
      if (!fromAuto && next === "stop" && state.running) {
        stopTimer(false);
      }
    }

    function render() {
      timerView.textContent = fmt(state.left);
      timerView.classList.toggle("ended", state.ended);
      activityView.textContent = taskInput.value.trim() || state.activity;
      startBtn.textContent = state.running ? "멈춤" : (state.left === 0 ? "다시 시작" : "시작");
      autoBtn.textContent = state.auto ? "자동 노랑 켜짐" : "자동 노랑 꺼짐";
      autoBtn.setAttribute("aria-pressed", String(state.auto));
      soundBtn.textContent = state.sound ? "종료 알림음 켜짐" : "종료 알림음 꺼짐";
      soundBtn.setAttribute("aria-pressed", String(state.sound));
      saveState();
    }

    // 새로고침해도 활동·시간·남은 시간이 유지되도록 저장
    const SAVE_KEY = "class_signal_state";
    function saveState() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          activity: state.activity, total: state.total, left: state.left, auto: state.auto,
          sound: state.sound, signal: state.signal, task: taskInput.value,
          endAt: state.running ? Date.now() + state.left * 1000 : 0,
        }));
      } catch (e) {}
    }
    function restoreState() {
      let d;
      try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) {}
      if (!d) return;
      state.activity = d.activity || state.activity;
      state.total = d.total || state.total;
      state.left = typeof d.left === "number" ? d.left : state.total;
      state.auto = d.auto !== false;
      state.sound = d.sound !== false;
      taskInput.value = d.task || "";
      document.getElementById("customMin").value = String(Math.max(1, Math.round(state.total / 60)));
      document.querySelectorAll(".preset").forEach((el) => el.classList.toggle("active", Number(el.dataset.sec) === state.total));
      document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c.dataset.activity === state.activity));
      setSignal(d.signal || "go", true);
      if (d.endAt) {
        state.left = Math.max(0, Math.round((d.endAt - Date.now()) / 1000));
        if (state.left > 0) startTimer();
        else { state.ended = true; setSignal("stop", true); }
      }
    }

    function applyAutoSignal() {
      if (!state.auto) return;
      if (state.left === 0) setSignal("stop", true);
      else if (state.left <= 60) setSignal("warn", true);
      else setSignal("go", true);
    }

    function tick() {
      if (state.left <= 0) {
        stopTimer(true);
        return;
      }
      state.left -= 1;
      applyAutoSignal();
      if (state.left === 0) {
        state.ended = true;
        setSignal("stop", true);
        stopTimer(true);
        chime();
      }
      render();
    }

    function startTimer() {
      if (state.left === 0) {
        state.left = state.total;
        state.ended = false;
      }
      if (state.running) return;
      state.running = true;
      applyAutoSignal();
      state.tick = setInterval(tick, 1000);
      render();
    }

    function stopTimer() {
      state.running = false;
      if (state.tick) clearInterval(state.tick);
      state.tick = null;
      render();
    }

    function resetTimer() {
      stopTimer();
      state.left = state.total;
      state.ended = false;
      if (state.auto) setSignal("go", true);
      render();
    }

    function setTotal(sec, markPreset) {
      state.total = sec;
      state.left = sec;
      state.ended = false;
      document.getElementById("customMin").value = String(Math.max(1, Math.round(sec / 60)));
      document.querySelectorAll(".preset").forEach((el) => {
        el.classList.toggle("active", markPreset && Number(el.dataset.sec) === sec);
      });
      if (state.auto) setSignal("go", true);
      render();
    }

    document.querySelectorAll(".light").forEach((el) => {
      el.addEventListener("click", () => {
        state.auto = false;
        setSignal(el.dataset.signal, false);
        render();
      });
    });
    document.querySelectorAll(".chip").forEach((el) => {
      el.addEventListener("click", () => {
        state.activity = el.dataset.activity;
        document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c === el));
        render();
      });
    });
    document.querySelectorAll(".preset").forEach((el) => {
      el.addEventListener("click", () => {
        stopTimer();
        setTotal(Number(el.dataset.sec), true);
      });
    });
    startBtn.addEventListener("click", () => state.running ? stopTimer() : startTimer());
    document.getElementById("resetBtn").addEventListener("click", resetTimer);
    autoBtn.addEventListener("click", () => {
      state.auto = !state.auto;
      if (state.auto) applyAutoSignal();
      render();
    });
    soundBtn.addEventListener("click", () => { state.sound = !state.sound; render(); });
    document.getElementById("applyMin").addEventListener("click", () => {
      const min = Math.min(60, Math.max(1, Number(document.getElementById("customMin").value) || 5));
      stopTimer();
      setTotal(min * 60, false);
    });
    taskInput.addEventListener("input", render);

    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.code === "Digit1") { state.auto = false; setSignal("go"); render(); }
      if (e.code === "Digit2") { state.auto = false; setSignal("warn"); render(); }
      if (e.code === "Digit3") { state.auto = false; setSignal("stop"); render(); }
      if (e.code === "Space") { e.preventDefault(); state.running ? stopTimer() : startTimer(); }
      if (e.code === "KeyR") resetTimer();
    });

    restoreState();
    render();
  </script>
</body>
</html>
